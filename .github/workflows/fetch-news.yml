name: Daily World News

on:
  schedule:
    # 每天北京时间 09:00（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 也支持手动触发

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Fetch news and send to Feishu
        timeout-minutes: 10
        run: |
          set -e
          pip list 2>/dev/null | grep -iE "feedparser|beautifulsoup|requests" || true
          python fetch_news.py 2>&1
          echo "---"
          echo "HTML output:"
          cat daily_news.html | head -5
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
